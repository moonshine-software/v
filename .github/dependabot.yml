version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ['*']
    ignore:
      # MoonShine is pinned to a reviewed development commit and updated by hand.
      - dependency-name: moonshine/moonshine
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    ignore:
      # docker.angie.software requires authentication that Dependabot does not have.
      - dependency-name: angie
      - dependency-name: '*'
        update-types: [version-update:semver-major]
