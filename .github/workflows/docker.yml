name: Production container smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: production
          tags: moonshine-v:production-smoke
          load: true
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: web
          tags: moonshine-v:web-smoke
          load: true
          cache-from: type=gha,scope=php
      - run: bash docker/smoke.sh
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose --env-file docker/.env -f docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: cp docker/.env.example docker/.env
      - run: sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" docker/.env
      - run: $COMPOSE up -d --build --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/admin/login > /dev/null
      - if: failure()
        run: $COMPOSE logs --no-color --tail 100
      - if: always()
        run: $COMPOSE down --volumes --remove-orphans
